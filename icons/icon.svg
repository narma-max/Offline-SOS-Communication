<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="65%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#ff1744" stroke-width="8"/>

  <!-- Radio wave circles -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffab00" stroke-width="4" stroke-dasharray="16 12" opacity="0.35"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ff1744" stroke-width="6" opacity="0.5"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00e676" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Glowing core -->
  <circle cx="256" cy="256" r="92" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Beacon waves & signal icon -->
  <path d="M256 186 L256 216 M256 296 L256 326 M186 256 L216 256 M296 256 L326 256" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Central SOS Text -->
  <text x="256" y="274" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">SOS</text>

  <!-- Corner GPS Indicator dots -->
  <circle cx="100" cy="100" r="14" fill="#00e676" opacity="0.8"/>
  <circle cx="412" cy="100" r="14" fill="#ffab00" opacity="0.8"/>
  <circle cx="100" cy="412" r="14" fill="#448aff" opacity="0.8"/>
  <circle cx="412" cy="412" r="14" fill="#ea80fc" opacity="0.8"/>
</svg>